api_version: v1

security_policy:
  name: standard-security-policy
  version: "1.0"

defaults:
  public_access: false
  encryption_required: true

workspace:
  public_access:
    allowed: false

  encryption:
    mode: platform_managed

identity:
  access_model: enterprise_groups
  service_principals: supported
  privileged_access: standard

iam:
  workspace_role:
    required: true

  data_access_role:
    required: true