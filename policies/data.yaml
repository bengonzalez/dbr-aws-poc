api_version: v1

# Only the fields resolver.py actually reads live here - see
# CLAUDE.md Sec5.13 (2026-10-14). Each classification's `governance:`
# sub-block was removed - it duplicated governance.yaml's global
# unity_catalog.required and was never read here.

data_policy:
  name: standard-data-policy
  version: "1.0"

classifications:

  public:
    encryption:
      required: true

  internal:
    encryption:
      required: true

  sensitive:
    encryption:
      required: true

  restricted:
    encryption:
      required: true
      customer_managed_required: true
