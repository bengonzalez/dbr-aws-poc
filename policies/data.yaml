api_version: v1

data_policy:
  name: standard-data-policy
  version: "1.0"

classifications:

  public:
    encryption:
      required: true

    governance:
      unity_catalog: required

  internal:
    encryption:
      required: true

    governance:
      unity_catalog: required

  sensitive:
    encryption:
      required: true

    governance:
      unity_catalog: required

  restricted:
    encryption:
      required: true
      customer_managed_required: true

    governance:
      unity_catalog: required