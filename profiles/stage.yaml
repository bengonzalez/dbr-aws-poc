api_version: v1

# Only the fields resolver.py actually reads live here - see
# CLAUDE.md Sec5.13 (2026-10-14). Aspirational fields that used to live in
# this file (network.*, storage.*, governance.*, identity.*, validation.*,
# lifecycle.*) were removed because nothing consumed them; the design
# intent they captured is already written up in CLAUDE.md Sec6's decision
# baseline table. Add a field back here only once resolver.py or a
# Terraform module actually reads it.

profile:
  name: stage
  version: "1.0"
  description: Staging and pre-production Databricks workspace

workspace:
  isolation: dedicated

encryption:
  workspace: platform_managed
  application_data: platform_managed

compute:
  policy: stage

logging:
  level: enhanced
  centralized: true
