api_version: v1

platform:
  name: databricks-platform
  version: "1.0"

# Reserved CIDR space for VPCs this factory creates itself (network.strategy
# == "isolated" -> vpc_ownership resolves to "terraform"). Existing/"custom"
# VPCs are untouched by this pool - their CIDR is whatever the existing VPC
# already has, recorded informationally per-workspace instead (see
# infrastructure/deployments/<env>/<name>/deployment.yaml's optional
# platform.vpc_cidr field).
#
# Convention: pick the next unused /16 inside this range for a new isolated
# workspace's network.vpc_cidr, then run
# resolver/check_cidr_allocations.py (also run automatically by
# generate_tfvars.py) to confirm it doesn't collide with another
# workspace's already-committed deployment.yaml. This is a collision
# checker, not an automatic allocator - the /16 itself is still a manual
# choice. See CLAUDE.md §5.12/§8 milestone 14.
cidr_pools:
  isolated_vpc_pool: 10.64.0.0/10   # 10.64.0.0 - 10.127.255.255

# Known existing Unity Catalog metastores, keyed by Databricks account id
# (not AWS account id - a metastore belongs to a Databricks account/region,
# which is independent of which AWS account hosts the workspace; multiple
# Databricks accounts can and do share one AWS account in this project's
# test setup). Not created by this factory (CLAUDE.md §6) - each of these
# was auto-provisioned by Databricks and found via
# `databricks account metastores list --profile <profile>`.
#
# resolver/generate_tfvars.py looks this up automatically using
# deployment.yaml's databricks.account_id + the resolved cloud.region -
# a workspace only needs its own deployment.yaml entry
# (unity_catalog.existing_metastore_id) to override this default, not to
# supply it every time. See CLAUDE.md §5.3/§8 milestone 20.
#
# privatelink_available (sibling to metastore_id, per account - not per
# region, since it's an account pricing-tier fact): whether this
# Databricks account has Enterprise tier, required for
# modules/workspace-privatelink. Both known accounts: false, confirmed
# by real "Feature cannot be accessed... ENTERPRISE" errors hit twice
# (CLAUDE.md §5.11). Drives network.connectivity's "auto" default
# (resolver/inventory.py's resolve_connectivity(), §8 milestone 27) -
# NAT whenever PrivateLink isn't available, not a silent connectivity gap.
databricks:
  accounts:
    "331f8702-2e00-42e9-82e2-2935e7e1d4f9":
      privatelink_available: false
      regions:
        us-east-1:
          metastore_id: "1361f3a1-e668-4807-89ee-1936b7a877fb"

    "eddbb85f-6b3c-4261-8ca2-0d9d62575ce2":
      privatelink_available: false
      regions:
        us-east-1:
          metastore_id: "0745ece3-cb83-4a7f-9dc5-dc1716c015c7"

aws:

  accounts:

    dev:
      account_id: "556940913059"
      environment: dev

      # Default Databricks account workspaces in this AWS account register
      # with, looked up automatically by resolver/generate_tfvars.py (same
      # pattern as metastore_id/vpc.id below) - a workspace only needs an
      # override (request-level cloud.databricks_account_id, or
      # deployment.yaml's databricks.account_id) for the rare case it must
      # land in a DIFFERENT Databricks account than this default. This AWS
      # account also hosts a second, deliberately different Databricks
      # account (eddbb85f-6b3c-4261-8ca2-0d9d62575ce2, used by
      # isolated-proof/client-vpc-proof to test PrivateLink/Enterprise-tier
      # behavior) via that override mechanism - see CLAUDE.md §8 milestone 29.
      databricks_account_id: "331f8702-2e00-42e9-82e2-2935e7e1d4f9"

      regions:

        us-east-1:
          approved: true

          # Region-level convention for auto-carving subnets out of
          # WHICHEVER VPC a workspace ends up using - the account's own
          # "primary" VPC below, a client-provided existing VPC named by
          # a request's network.existing_vpc_id, or a fresh isolated VPC
          # created from a request's network.vpc_cidr. AZs are a region
          # property, not a VPC property, so this lives here rather than
          # nested under any one VPC. Subnet count is simply
          # len(availability_zones) - no separate count field needed.
          # Consumed by resolver/generate_tfvars.py's subnet
          # auto-allocation (CLAUDE.md §8 milestone 28); resolver.py
          # itself never reads this (same account-blind boundary as
          # vpc.id/route_table_ids/metastore_id below).
          subnet_defaults:
            prefix_length: 24
            availability_zones:
              - us-east-1a
              - us-east-1b

          networks:

            primary:
              name: databricks-dev

              # id/cidr looked up automatically by resolver/generate_tfvars.py
              # (and resolver/check_cidr_allocations.py) whenever VPC
              # ownership resolves to "existing" - a workspace's own
              # deployment.yaml 'platform.vpc_id'/'vpc_cidr' overrides this
              # default for a workspace reusing a DIFFERENT existing VPC
              # (e.g. a client-provided one). See CLAUDE.md §5.3/§8.
              vpc:
                ownership: existing
                id: vpc-60c2a81d
                cidr: 172.31.0.0/16

              routing:
                ownership: existing

                # Looked up automatically by resolver/generate_tfvars.py
                # (and resolver/check_cidr_allocations.py) whenever routing
                # ownership resolves to "existing" - same auto-lookup
                # pattern as vpc.id/cidr above and the Unity Catalog
                # metastore_id below. A workspace's own deployment.yaml
                # 'platform.route_table_ids' overrides this default for
                # a workspace reusing different route tables.
                route_table_ids:
                  - rtb-042726c440509ac14
                  - rtb-0e29c295cc93c131c

              security_groups:
                ownership: terraform

              endpoints:
                ownership: existing

              dns:
                ownership: existing
                private_dns: true