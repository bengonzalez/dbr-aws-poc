# Deployment-only values for the "isolated-proof" workspace - a real proof
# that the factory can build a fully isolated deployment (dedicated VPC,
# subnets, routing, security group, S3/STS endpoints) end to end, the same
# shape the original POC built by hand.
#
# Destroyed 2026-10-13 as part of moving to the shared-root + S3-backend
# model (CLAUDE.md) - this file is kept so the workspace can be redeployed
# the same way later: regenerate via resolver/generate_tfvars.py and
# resolver/generate_backend_config.py, then terraform init/apply.

api_version: v1

databricks:
  # Second account created specifically to test PrivateLink (requires
  # Enterprise tier, which the original 331f8702... account doesn't have).
  account_id: "eddbb85f-6b3c-4261-8ca2-0d9d62575ce2"

# No "platform" block - the isolated strategy creates its own dedicated VPC,
# nothing pre-existing to point at.

network:
  vpc_cidr: 10.70.0.0/16
  subnets:
    private:
      - cidr: 10.70.0.0/24
        availability_zone: us-east-1a
      - cidr: 10.70.1.0/24
        availability_zone: us-east-1b
  # NAT Gateway's public subnet - required since network.connectivity
  # resolves to "nat" by default (this workspace's Databricks account has
  # no PrivateLink/Enterprise tier - platform/inventory/aws.yaml's
  # 'privatelink_available' says so; see §8 milestone 27). Same AZ as the
  # first private subnet above - one NAT Gateway, not a multi-AZ HA setup.
  nat_subnet_cidr: 10.70.2.0/24

# No overrides needed: this workspace's request never set
# network.connectivity, so it defaults to "auto" - which already
# correctly resolves to NAT (no explicit privatelink_enabled/nat_enabled
# override needed, unlike before this feature existed).

# The metastore for this workspace's Databricks account (eddbb85f.../TSA)
# is looked up automatically from platform/inventory/aws.yaml's
# 'databricks.accounts' section - nothing needed here unless this
# workspace needs to override that default:
# unity_catalog:
#   existing_metastore_id: "..."
