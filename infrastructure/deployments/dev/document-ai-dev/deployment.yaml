# Deployment-only values for the "document-ai-dev" workspace: the handful of
# concrete inputs Terraform needs that resolver/main.py does not (and should
# not) resolve on its own — existing resource ids and concrete subnet CIDRs.
# Everything else comes from normalized/document-ai-dev.yaml.
#
# This file is committed (it's infrastructure configuration, not a secret).
# The Databricks CLI profile used to run Terraform is NOT here — see
# infrastructure/workspace/local.auto.tfvars.example.

api_version: v1

databricks:
  account_id: "331f8702-2e00-42e9-82e2-2935e7e1d4f9"

# This workspace's VPC/route tables are the AWS account's known "primary"
# network (vpc-60c2a81d) - looked up automatically from
# platform/inventory/aws.yaml, same pattern as the Unity Catalog metastore
# lookup below. Nothing needed here unless this workspace should reuse a
# DIFFERENT existing VPC than the account's primary one:
# platform:
#   vpc_id: vpc-...
#   vpc_cidr: ...              # informational only - lets
#                              # check_cidr_allocations.py confirm
#                              # containment; not passed to Terraform
#   route_table_ids:
#     - rtb-...

# Always needed: Terraform always creates the private subnets themselves,
# regardless of VPC ownership.
#
# network.vpc_cidr would go here too, but only when VPC ownership resolves
# to "terraform" (the isolated strategy's default, or an override below) -
# not needed for this workspace since it reuses the existing VPC above.
network:
  subnets:
    private:
      - cidr: 172.31.100.0/24
        availability_zone: us-east-1a
      - cidr: 172.31.101.0/24
        availability_zone: us-east-1b

# Optional per-resource ownership overrides (uncomment to deviate from the
# network.strategy preset for one specific resource):
# overrides:
#   vpc_ownership: terraform
#   routing_ownership: terraform
#   security_group_ownership: terraform
#   endpoints_ownership: terraform
#   existing_security_group_id: sg-xxxxxxxx

# Optional bring-your-own KMS keys (only meaningful when encryption is
# customer_managed; omit to let the platform create dedicated keys):
# kms:
#   existing_workspace_storage_key_arn: arn:aws:kms:...
#   existing_workspace_storage_key_alias: alias/...
#   existing_managed_services_key_arn: arn:aws:kms:...
#   existing_managed_services_key_alias: alias/...

# The metastore for this workspace's Databricks account (331f8702...) is
# looked up automatically from platform/inventory/aws.yaml's
# 'databricks.accounts' section - nothing needed here unless this
# workspace needs to override that default:
# unity_catalog:
#   existing_metastore_id: "..."
