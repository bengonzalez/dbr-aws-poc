# Deployment-only values for the "document-ai-dev" workspace: the handful of
# concrete inputs Terraform needs that resolver/main.py does not (and should
# not) resolve on its own — existing resource ids and concrete subnet CIDRs.
# Everything else comes from normalized/document-ai-dev.yaml.
#
# This file is committed (it's infrastructure configuration, not a secret).
# The Databricks CLI profile used to run Terraform is NOT here — see
# infrastructure/workspace/local.auto.tfvars.example.

api_version: v1

# This workspace's Databricks account is the AWS account's known default
# (331f8702...) - looked up automatically from platform/inventory/aws.yaml's
# 'aws.accounts.<name>.databricks_account_id'. Nothing needed here unless
# this workspace needs to register with a DIFFERENT Databricks account:
# databricks:
#   account_id: "..."

# This workspace's VPC/route tables are the AWS account's known "primary"
# network (vpc-60c2a81d) - looked up automatically from
# platform/inventory/aws.yaml, same pattern as the Unity Catalog metastore
# lookup below. Nothing needed here unless this workspace should reuse a
# DIFFERENT existing VPC than the account's primary one:
# platform:
#   vpc_id: vpc-...
#   vpc_cidr: ...              # informational only - lets
#                              # check_cidr_allocations.py confirm
#                              # containment; not passed to Terraform
#   route_table_ids:
#     - rtb-...

# Always needed: Terraform always creates the private subnets themselves,
# regardless of VPC ownership.
#
# network.vpc_cidr would go here too, but only when VPC ownership resolves
# to "terraform" (the isolated strategy's default, or an override below) -
# not needed for this workspace since it reuses the existing VPC above.
network:
  subnets:
    private:
      - cidr: 172.31.100.0/24
        availability_zone: us-east-1a
      - cidr: 172.31.101.0/24
        availability_zone: us-east-1b

# Optional per-resource ownership overrides - rarely needed now that
# routing/endpoints ownership are INFERRED (CLAUDE.md §8 milestone 30):
# "existing" automatically whenever route table ids are actually known
# for the VPC in play (this workspace's primary VPC has them, so both
# already resolve to "existing" with no override at all), "terraform"
# otherwise - endpoints defaults to whatever routing resolves to. An
# existing security group id is normally supplied in the workspace
# request instead (network.existing_security_group_id) - its presence
# alone implies security_group_ownership "existing" too (§8 milestone
# 29). This leaves vpc_ownership as the only one that ever commonly
# needs setting here:
# overrides:
#   vpc_ownership: terraform
#   routing_ownership: terraform    # rare: overrides the inference
#   endpoints_ownership: terraform  # rare: overrides the inference
#   existing_security_group_id: sg-xxxxxxxx   # rare: bypasses the request

# Bring-your-own KMS keys are normally supplied in the workspace request
# instead (encryption.existing_workspace_storage_key_arn/alias,
# encryption.existing_managed_services_key_arn/alias) - only meaningful
# when encryption.workspace resolves to customer_managed. This 'kms:'
# block is a rarely-needed override on top of that:
# kms:
#   existing_workspace_storage_key_arn: arn:aws:kms:...
#   existing_workspace_storage_key_alias: alias/...
#   existing_managed_services_key_arn: arn:aws:kms:...
#   existing_managed_services_key_alias: alias/...

# The metastore for this workspace's Databricks account (331f8702...) is
# looked up automatically from platform/inventory/aws.yaml's
# 'databricks.accounts' section. A different metastore is normally
# requested via governance.existing_metastore_id in the workspace
# request - this 'unity_catalog:' block is a rarely-needed override:
# unity_catalog:
#   existing_metastore_id: "..."
